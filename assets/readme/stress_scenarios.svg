<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
  <title>Execution Stress Ladder</title>
  <desc>Topstep-style lifecycle EV under added cost and fill-degradation assumptions.</desc>
  <style>
    .bg { fill: #fbfcfb; stroke: #d4ddd7; stroke-width: 1; }
    .title { fill: #171c19; font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #58625c; font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #58625c; font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .small { fill: #58625c; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #171c19; font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .axis { stroke: #d4ddd7; stroke-width: 1; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="919" height="329" rx="10" />
  <text class="title" x="28" y="38">Execution Stress Ladder</text>
  <text class="subtitle" x="28" y="60">Topstep-style lifecycle EV under added cost and fill-degradation assumptions.</text>
  <line class="axis" x1="64" y1="266" x2="880" y2="266" />
  <rect x="84" y="96.00" width="138" height="170.00" rx="8" fill="#0f766e" fill-opacity="0.86" />
  <text class="value" x="153.0" y="86.0" text-anchor="middle">$2,509.22</text>
  <text class="label" x="153.0" y="288" text-anchor="middle">base</text>
  <text class="small" x="153.0" y="306" text-anchor="middle">payout 73.3%</text>
  <rect x="264" y="108.53" width="138" height="157.47" rx="8" fill="#3b7f77" fill-opacity="0.86" />
  <text class="value" x="333.0" y="98.5" text-anchor="middle">$2,324.31</text>
  <text class="label" x="333.0" y="288" text-anchor="middle">plus 1usd</text>
  <text class="small" x="333.0" y="306" text-anchor="middle">payout 71.3%</text>
  <rect x="444" y="122.36" width="138" height="143.64" rx="8" fill="#8f6c1e" fill-opacity="0.86" />
  <text class="value" x="513.0" y="112.4" text-anchor="middle">$2,120.10</text>
  <text class="label" x="513.0" y="288" text-anchor="middle">plus 2usd</text>
  <text class="small" x="513.0" y="306" text-anchor="middle">payout 68.0%</text>
  <rect x="624" y="205.82" width="138" height="60.18" rx="8" fill="#b91c1c" fill-opacity="0.86" />
  <text class="value" x="693.0" y="195.8" text-anchor="middle">$888.29</text>
  <text class="label" x="693.0" y="288" text-anchor="middle">fill haircut 5pct</text>
  <text class="small" x="693.0" y="306" text-anchor="middle">payout 47.3%</text>
</svg>
