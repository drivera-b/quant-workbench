<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" role="img" aria-labelledby="title desc">
  <title>Recent Window Checks</title>
  <desc>Expectancy per trade across 20-90 session slices versus the frozen benchmark.</desc>
  <style>
    .bg { fill: #fbfcfb; stroke: #d4ddd7; stroke-width: 1; }
    .title { fill: #171c19; font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .subtitle { fill: #58625c; font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .label { fill: #58625c; font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .small { fill: #58625c; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .value { fill: #171c19; font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .axis { stroke: #d4ddd7; stroke-width: 1; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="919" height="329" rx="10" />
  <text class="title" x="28" y="38">Recent Window Checks</text>
  <text class="subtitle" x="28" y="60">Expectancy per trade across 20-90 session slices versus the frozen benchmark.</text>
  <line class="axis" x1="64" y1="266" x2="880" y2="266" />
  <rect x="96" y="177.01" width="108" height="88.99" rx="8" fill="#a16207" fill-opacity="0.82" />
  <text class="value" x="150.0" y="167.0" text-anchor="middle">$23.76</text>
  <text class="label" x="150.0" y="288" text-anchor="middle">20 sessions</text>
  <text class="small" x="150.0" y="306" text-anchor="middle">inconclusive</text>
  <rect x="252" y="107.18" width="108" height="158.82" rx="8" fill="#a16207" fill-opacity="0.82" />
  <text class="value" x="306.0" y="97.2" text-anchor="middle">$42.40</text>
  <text class="label" x="306.0" y="288" text-anchor="middle">30 sessions</text>
  <text class="small" x="306.0" y="306" text-anchor="middle">inconclusive</text>
  <rect x="408" y="96.00" width="108" height="170.00" rx="8" fill="#0f766e" fill-opacity="0.82" />
  <text class="value" x="462.0" y="86.0" text-anchor="middle">$45.39</text>
  <text class="label" x="462.0" y="288" text-anchor="middle">45 sessions</text>
  <text class="small" x="462.0" y="306" text-anchor="middle">on track</text>
  <rect x="564" y="168.35" width="108" height="97.65" rx="8" fill="#a16207" fill-opacity="0.82" />
  <text class="value" x="618.0" y="158.4" text-anchor="middle">$26.07</text>
  <text class="label" x="618.0" y="288" text-anchor="middle">60 sessions</text>
  <text class="small" x="618.0" y="306" text-anchor="middle">inconclusive</text>
  <rect x="720" y="161.31" width="108" height="104.69" rx="8" fill="#0f766e" fill-opacity="0.82" />
  <text class="value" x="774.0" y="151.3" text-anchor="middle">$27.95</text>
  <text class="label" x="774.0" y="288" text-anchor="middle">90 sessions</text>
  <text class="small" x="774.0" y="306" text-anchor="middle">on track</text>
